<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ResumeAI - AI-powered Resume Analyzer and Career Intelligence Platform"
    >

    <title>ResumeAI | AI Resume Analyzer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <nav
            class="container"
            style="
                min-height: 70px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            "
        >

            <a
                href="index.html"
                style="
                    font-size: 22px;
                    font-weight: 800;
                    color: var(--primary);
                "
            >
                ResumeAI
            </a>

            <div
                style="
                    display: flex;
                    gap: 10px;
                "
            >

                <a
                    href="pages/login.html"
                    class="btn btn-secondary"
                >
                    Login
                </a>

                <a
                    href="pages/register.html"
                    class="btn btn-primary"
                >
                    Get Started
                </a>

            </div>

        </nav>

    </header>


    <main>

        <section
            style="
                min-height: calc(100vh - 70px);
                display: flex;
                align-items: center;
            "
        >

            <div class="container">

                <div
                    style="
                        max-width: 780px;
                        margin: 0 auto;
                        text-align: center;
                    "
                >

                    <span
                        class="badge badge-primary"
                        style="margin-bottom: 18px;"
                    >
                        AI-Powered Resume Intelligence
                    </span>

                    <h1
                        style="
                            font-size: clamp(38px, 6vw, 64px);
                            line-height: 1.1;
                            margin-bottom: 20px;
                        "
                    >
                        Build a Resume That
                        <span style="color: var(--primary);">
                            Gets Noticed
                        </span>
                    </h1>

                    <p
                        style="
                            max-width: 650px;
                            margin: 0 auto 30px;
                            color: var(--text-secondary);
                            font-size: 17px;
                        "
                    >
                        Analyze your resume with AI, identify missing
                        skills, improve your ATS score, discover relevant
                        jobs, and get personalized career recommendations.
                    </p>

                    <div
                        style="
                            display: flex;
                            justify-content: center;
                            gap: 12px;
                            flex-wrap: wrap;
                        "
                    >

                        <a
                            href="pages/register.html"
                            class="btn btn-primary"
                        >
                            Analyze My Resume
                        </a>

                        <a
                            href="pages/login.html"
                            class="btn btn-secondary"
                        >
                            Sign In
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
